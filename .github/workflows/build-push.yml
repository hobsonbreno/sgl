name: CI - Build and Push to DockerHub

on:
  push:
    branches:
      - main
      - fix/supplier-discovery-override
      - feature/inteligencia-mercado-fornecedores
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'market-intelligence/**'
      - '.github/workflows/**'

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Calculate short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: hobson007breno/sgl-backend:${{ steps.vars.outputs.sha_short }},hobson007breno/sgl-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: hobson007breno/sgl-frontend:${{ steps.vars.outputs.sha_short }},hobson007breno/sgl-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Market Intelligence
        uses: docker/build-push-action@v5
        with:
          context: ./market-intelligence
          file: ./market-intelligence/Dockerfile
          push: true
          platforms: linux/amd64
          tags: hobson007breno/sgl-market-intelligence:${{ steps.vars.outputs.sha_short }},hobson007breno/sgl-market-intelligence:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Kubernetes manifests
        run: |
          sed -i "s|image: hobson007breno/sgl-backend:.*|image: hobson007breno/sgl-backend:${{ steps.vars.outputs.sha_short }}|g" k8s/backend.yaml
          sed -i "s|image: hobson007breno/sgl-frontend:.*|image: hobson007breno/sgl-frontend:${{ steps.vars.outputs.sha_short }}|g" k8s/frontend.yaml
          sed -i "s|image: hobson007breno/sgl-market-intelligence:.*|image: hobson007breno/sgl-market-intelligence:${{ steps.vars.outputs.sha_short }}|g" k8s/market-intelligence.yaml
          sed -i "s|image: hobson007breno/sgl-backend:.*|image: hobson007breno/sgl-backend:${{ steps.vars.outputs.sha_short }}|g" k8s/etl-cronjob.yaml

      - name: Commit and push manifest updates
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add k8s/*.yaml
          git commit -m "chore(gitops): update image tags to ${{ steps.vars.outputs.sha_short }} [skip ci]" || echo "No changes to commit"
          git push
