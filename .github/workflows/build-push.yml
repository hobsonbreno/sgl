name: CI - Build and Push to DockerHub

on:
  push:
    branches:
      - main
      - feature/inteligencia-mercado-fornecedores
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'market-intelligence/**'
      - '.github/workflows/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: hobson007breno/sgl-backend:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: hobson007breno/sgl-frontend:latest

      - name: Build and Push Market Intelligence
        uses: docker/build-push-action@v5
        with:
          context: ./market-intelligence
          file: ./market-intelligence/Dockerfile
          push: true
          tags: hobson007breno/sgl-market-intelligence:latest
