apiVersion: batch/v1
kind: CronJob
metadata:
  name: sgl-etl-cronjob
spec:
  # Roda às 02:00 da manhã do dia 10 de cada mês
  schedule: "0 2 10 * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          containers:
          - name: sgl-etl
            image: hobson007breno/sgl-backend:3c9d3f9
            command:
            - npm
            - run
            - sync:receita:prod
            env:
            - name: MONGO_URI
              value: "mongodb://mongo:27017/licitacoes"
            - name: TZ
              value: "America/Sao_Paulo"
            - name: PNCP_BASE_URL
              value: "https://pncp.gov.br/api/consulta"
            - name: SERPAPI_KEYS
              valueFrom:
                secretKeyRef:
                  name: sgl-secrets
                  key: SERPAPI_KEYS
                  optional: true
            resources:
              requests:
                memory: "512Mi"
                cpu: "250m"
              limits:
                memory: "2048Mi"
                cpu: "1000m"
          restartPolicy: OnFailure

