apiVersion: apps/v1
kind: Deployment
metadata:
  name: sgl-frontend
spec:
  selector:
    matchLabels:
      app: sgl-frontend
  template:
    metadata:
      labels:
        app: sgl-frontend
    spec:
      containers:
      - name: frontend
        image: hobson007breno/sgl-frontend:a2181b3
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort
  selector:
    app: sgl-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
