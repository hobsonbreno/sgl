version: '3.9'
services:
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "7000:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "7005:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - MONGO_URI=mongodb://host.docker.internal:7009/licitacoes
      - PNCP_BASE_URL=https://pncp.gov.br/api/consulta
      - TZ=America/Sao_Paulo
    env_file:
      - backend/.env
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "7009:27017"
    volumes:
      - mongo_data:/data/db

  market-intelligence:
    build: ./market-intelligence
    restart: unless-stopped
    ports:
      - "7011:7010"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - MONGO_URI=mongodb://host.docker.internal:7009/licitacoes
      - TZ=America/Sao_Paulo
    depends_on:
      - mongo

volumes:
  mongo_data:
