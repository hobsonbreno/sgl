version: '3.9'
services:
  frontend:
    build: ./frontend
    ports:
      - "7000:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "7005:3000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/licitacoes
      - PNCP_BASE_URL=https://pncp.gov.br/api/consulta
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    ports:
      - "7009:27017"
    volumes:
      - mongo_data:/data/db

  market-intelligence:
    build: ./market-intelligence
    ports:
      - "7010:7010"
    environment:
      - MONGO_URI=mongodb://mongo:27017/licitacoes
    depends_on:
      - mongo

volumes:
  mongo_data:
